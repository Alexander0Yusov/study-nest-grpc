services:
  task-postgres:
    image: postgres:16-alpine
    container_name: study-task-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${TASK_DB_NAME:-study_tasks}
      POSTGRES_USER: ${TASK_DB_USERNAME:-study_tasks}
      POSTGRES_PASSWORD: ${TASK_DB_PASSWORD:-study_tasks}
    ports:
      - '${TASK_DB_PORT:-5435}:5432'
    volumes:
      - task-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  task-postgres-data:

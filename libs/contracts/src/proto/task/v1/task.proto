syntax = "proto3";

package study.tasks.v1;

import "google/protobuf/timestamp.proto";

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_PENDING = 1;
  TASK_STATUS_IN_PROGRESS = 2;
  TASK_STATUS_COMPLETED = 3;
}

enum DeleteTaskErrorCode {
  DELETE_TASK_ERROR_CODE_UNSPECIFIED = 0;
  DELETE_TASK_ERROR_CODE_NOT_FOUND = 1;
  DELETE_TASK_ERROR_CODE_INVALID_ARGUMENT = 2;
  DELETE_TASK_ERROR_CODE_DUPLICATE = 3;
}

message Task {
  reserved 1;
  reserved "id";

  string title = 2;
  optional string description = 3;
  TaskStatus status = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
  int32 task_id = 7;
}

message CreateTaskRequest {
  string title = 1;
  optional string description = 2;
}

message CreateTaskResponse {
  Task task = 1;
}

message GetTaskRequest {
  int32 task_id = 1;
}

message GetTaskResponse {
  Task task = 1;
}

message StreamTasksRequest {}

message UpdateTaskStatusRequest {
  reserved 1;
  reserved "id";

  TaskStatus status = 2;
  int32 task_id = 3;
}

message UpdateTaskStatusesResponse {
  uint32 requested_count = 1;
  uint32 updated_count = 2;
}

message DeleteTaskRequest {
  reserved 1;
  reserved "id";

  int32 task_id = 2;
}

message DeleteTaskError {
  DeleteTaskErrorCode code = 1;
  string message = 2;
}

message DeleteTaskResponse {
  reserved 1;
  reserved "requested_id";

  int32 requested_task_id = 4;

  oneof result {
    Task deleted_task = 2;
    DeleteTaskError error = 3;
  }
}

service TaskService {
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);

  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);

  // Returns a finite snapshot of all tasks.
  rpc StreamTasks(StreamTasksRequest) returns (stream Task);

  // Updates multiple tasks using a client request stream.
  rpc UpdateTaskStatuses(stream UpdateTaskStatusRequest)
  returns (UpdateTaskStatusesResponse);

  // Deletes tasks and emits one result for every incoming identifier.
  rpc DeleteTasks(stream DeleteTaskRequest)
  returns (stream DeleteTaskResponse);
}

